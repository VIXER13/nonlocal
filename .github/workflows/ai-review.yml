name: 🤖 AI Review

env:
  MODEL: ${{ inputs.model || vars.MODEL }}

on:
  pull_request:
    branches:
      - dev
    types: [opened, reopened]

  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request number to review"
        required: true
        type: number
      model:
        description: "Model name"
        required: false
        type: string

jobs:
  ai-review:
    name: Run AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@v1.4.0
        env:
          LLM__META__MODEL: ${{ env.MODEL }}
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.LLM_API_KEY }}
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
